services:
  mariadb-db:
    image: mariadb:12.3.3
    container_name: docker-mariadb-db-1
    ports:
      - 3306:3306
    environment:
      MARIADB_ROOT_PASSWORD: root
      # a server time zone with daylight saving time, so that the tests verify that timestamps are stored in UTC
      TZ: America/New_York
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 1s
      timeout: 1s
      retries: 60
